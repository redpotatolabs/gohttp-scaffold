# CI for a public redpotatolabs repo (a library, nothing deployed).
# GitHub-hosted runner, no secrets, read-only token: a fork's pull request runs
# here, so it must never reach the org's self-hosted runners or any secret.
# The job id `checks` is the status check the main ruleset requires.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
